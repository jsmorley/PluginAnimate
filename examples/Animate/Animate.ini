[Rainmeter]
Update=1000
DynamicWindowSize=1
AccurateText=1
BackgroundMode=2
SolidColor=24,27,34,255
OnRefreshAction=[!CommandMeasure MeasureAnimate "start"]

[Variables]
AnimationFile=#@#Loading.gif
FrameSpeed=0
Repeats=-1

[MeasureAnimate]
Measure=Plugin
Plugin=Animate
ImageName=#AnimationFile#
MeterName=MeterAnimation
DisplayLoading=0
Speed=#FrameSpeed#
Loop=#Repeats#
DynamicVariables=1

[MeterAnimation]
Meter=Image
X=0
Y=48
W=#CURRENTCONFIGWIDTH#
H=125
PreserveAspectRatio=1
DynamicVariables=1

[MeterTitle]
Meter=String
X=16
Y=12
Text=Animate.dll
FontFace=Segoe UI
FontSize=14
FontColor=240,240,245
AntiAlias=1

[StyleButton]
FontFace=Segoe UI
FontSize=10
FontColor=240,240,245
SolidColor=52,58,72,255
Padding=10,6,10,6
AntiAlias=1
MouseActionCursor=1

[MeterStart]
Meter=String
@Inherit=StyleButton
X=16
Y=190
Text=Start
LeftMouseUpAction=[!CommandMeasure MeasureAnimate "start"]

[MeterPause]
Meter=String
@Inherit=StyleButton
X=8R
Y=190
Text=Pause / Resume
LeftMouseUpAction=[!CommandMeasure MeasureAnimate "pause"]

[MeterEnd]
Meter=String
@Inherit=StyleButton
X=8R
Y=190
Text=End
LeftMouseUpAction=[!CommandMeasure MeasureAnimate "end"]

[MeterFaster]
Meter=String
@Inherit=StyleButton
X=16
Y=232
Text=20 ms
LeftMouseUpAction=[!SetVariable FrameSpeed 20][!UpdateMeasure MeasureAnimate][!UpdateMeter MeterInfo][!Redraw]
DynamicVariables=1

[MeterSlower]
Meter=String
@Inherit=StyleButton
X=8R
Y=232
Text=100 ms
LeftMouseUpAction=[!SetVariable FrameSpeed 100][!UpdateMeasure MeasureAnimate][!UpdateMeter MeterInfo][!Redraw]
DynamicVariables=1

[MeterInfo]
Meter=String
X=16
Y=276
W=290
H=45
FontFace=Segoe UI
FontSize=10
FontColor=190,198,215
AntiAlias=1
Text=[MeasureAnimate:0] ms / frame#CRLF#Speed=#FrameSpeed# (0=source) | Loop=-1
DynamicVariables=1

[MeterAuto]
Meter=String
@Inherit=StyleButton
X=188
Y=232
Text=Auto
LeftMouseUpAction=[!SetVariable FrameSpeed 0][!UpdateMeasure MeasureAnimate][!UpdateMeter MeterInfo][!Redraw]
