[Rainmeter]
Update=1000
DynamicWindowSize=1
AccurateText=1
BackgroundMode=2
SolidColor=24,27,34,255
; Animate preloads frame 1. Click Start to play.

[Metadata]
Name=Animate
Author=JSMorley
Version=2.1.0
Information=Animated GIF, APNG and WebP playback. Preloads frame 1 when the source is ready; Start plays the animation and reads current options.

[Variables]
AnimationFile=#@#Loading.gif
FrameSpeed=0
Repeats=-1

[MeasureAnimate]
Measure=Plugin
; Disabled=1 or Paused=1 skips preloading. Enable/unpause before Start.
Plugin=Animate
ImageName=#AnimationFile#
MeterName=MeterAnimation
DisplayLoading=0
Speed=#FrameSpeed#
Loop=#Repeats#
; Optional here: live speed-button updates between Start commands.
DynamicVariables=1

[MeterAnimation]
Meter=Image
X=0
Y=48
W=#CURRENTCONFIGWIDTH#
H=125
PreserveAspectRatio=1
DynamicVariables=1

[MeterTitle]
Meter=String
X=16
Y=12
Text=Animate.dll
FontFace=Segoe UI
FontSize=14
FontColor=240,240,245
AntiAlias=1

[StyleButton]
FontFace=Segoe UI
FontSize=10
FontColor=240,240,245
SolidColor=52,58,72,255
Padding=10,6,10,6
AntiAlias=1
MouseActionCursor=1

[MeterStart]
Meter=String
@Inherit=StyleButton
X=16
Y=190
Text=Start
LeftMouseUpAction=[!CommandMeasure MeasureAnimate "start"]

[MeterPause]
Meter=String
@Inherit=StyleButton
X=8R
Y=190
Text=Pause / Resume
LeftMouseUpAction=[!CommandMeasure MeasureAnimate "PauseResume"]

[MeterEnd]
Meter=String
@Inherit=StyleButton
X=8R
Y=190
Text=End
LeftMouseUpAction=[!CommandMeasure MeasureAnimate "end"]

[MeterFaster]
Meter=String
@Inherit=StyleButton
X=16
Y=232
Text=20 ms
LeftMouseUpAction=[!SetVariable FrameSpeed 20][!UpdateMeasure MeasureAnimate][!UpdateMeter MeterInfo][!Redraw]
DynamicVariables=1

[MeterSlower]
Meter=String
@Inherit=StyleButton
X=8R
Y=232
Text=100 ms
LeftMouseUpAction=[!SetVariable FrameSpeed 100][!UpdateMeasure MeasureAnimate][!UpdateMeter MeterInfo][!Redraw]
DynamicVariables=1

[MeterInfo]
Meter=String
X=16
Y=276
W=290
H=45
FontFace=Segoe UI
FontSize=10
FontColor=190,198,215
AntiAlias=1
Text=[MeasureAnimate:0] ms / frame#CRLF#Speed=#FrameSpeed# (0=source) | Loop=-1
DynamicVariables=1

[MeterAuto]
Meter=String
@Inherit=StyleButton
X=188
Y=232
Text=Auto
LeftMouseUpAction=[!SetVariable FrameSpeed 0][!UpdateMeasure MeasureAnimate][!UpdateMeter MeterInfo][!Redraw]

[MeterGif]
Meter=String
@Inherit=StyleButton
X=16
Y=330
Text=GIF
LeftMouseUpAction=[!SetVariable AnimationFile "#@#Loading.gif"][!CommandMeasure MeasureAnimate "start"]

[MeterApng]
Meter=String
@Inherit=StyleButton
X=8R
Y=330
Text=APNG
LeftMouseUpAction=[!SetVariable AnimationFile "#@#BeachBall.apng"][!CommandMeasure MeasureAnimate "start"]

[MeterWebp]
Meter=String
@Inherit=StyleButton
X=8R
Y=330
Text=WebP
LeftMouseUpAction=[!SetVariable AnimationFile "#@#DancingBanana.webp"][!CommandMeasure MeasureAnimate "start"]

[MeterBottomPadding]
Meter=Image
X=0
Y=0R
W=1
H=10
SolidColor=0,0,0,0
